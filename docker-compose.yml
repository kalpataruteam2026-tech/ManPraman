version: '3.8'

services:
  # -------------------------------------------------------------
  # PostgreSQL Database Service
  # -------------------------------------------------------------
  db:
    image: postgres:15-alpine
    container_name: metrocert_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------
  # FastAPI Metrology Engine & API Service
  # -------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: metrocert_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:password123@db:5432/postgres
      POSTGRES_URL: postgresql://postgres:password123@db:5432/postgres
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: postgres
      DB_USER: postgres
      DB_PASSWORD: password123
      DB_SCHEMA: oiml
      JWT_SECRET: oiml-r76-weighreport-secret-key-2026
    ports:
      - "8000:8000"

  # -------------------------------------------------------------
  # Next.js 14 Frontend Application
  # -------------------------------------------------------------
  frontend:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: metrocert_frontend
    restart: always
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://backend:8000
    ports:
      - "3000:3000"

volumes:
  postgres_data:
